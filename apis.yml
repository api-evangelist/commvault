aid: commvault
name: Commvault
description: >-
  Commvault is a cloud-native cyber resilience platform that delivers unified data security, identity resilience, and
  cyber recovery. The Commvault REST API, Command Center API, and Automation API provide programmatic access to backup,
  restore, replication, threat scan, reporting, and orchestration capabilities across enterprise workloads spanning
  on-premises, virtual machines, and cloud applications.

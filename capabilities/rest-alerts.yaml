naftiko: 1.0.0-alpha2
info:
  label: Commvault REST API — Alerts
  description: 'Commvault REST API — Alerts. 1 operations. Lead operation: Commvault List alert rules. Self-contained Naftiko
    capability covering one Commvault business surface.'
  tags:
  - Commvault
  - Alerts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMMVAULT_API_KEY: COMMVAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-alerts
    baseUri: https://{webserver}/webconsole/api
    description: Commvault REST API — Alerts business capability. Self-contained, no shared references.
    resources:
    - name: AlertRule
      path: /AlertRule
      operations:
      - name: listalerts
        method: GET
        description: Commvault List alert rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authtoken
      value: '{{env.COMMVAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-alerts-rest
    port: 8080
    description: REST adapter for Commvault REST API — Alerts. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/alertrule
      name: alertrule
      description: REST surface for AlertRule.
      operations:
      - method: GET
        name: listalerts
        description: Commvault List alert rules
        call: rest-alerts.listalerts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-alerts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commvault REST API — Alerts. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: commvault-list-alert-rules
      description: Commvault List alert rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-alerts.listalerts
      outputParameters:
      - type: object
        mapping: $.

    - name: V4-ServerPlan
      path: /V4/ServerPlan
      operations:
      - name: listplans
        method: GET
        description: Commvault List server plans
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createplan

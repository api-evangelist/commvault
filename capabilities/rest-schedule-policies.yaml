naftiko: 1.0.0-alpha2
info:
  label: Commvault REST API — Schedule Policies
  description: 'Commvault REST API — Schedule Policies. 1 operations. Lead operation: Commvault List schedule policies. Self-contained
    Naftiko capability covering one Commvault business surface.'
  tags:
  - Commvault
  - Schedule Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMMVAULT_API_KEY: COMMVAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-schedule-policies
    baseUri: https://{webserver}/webconsole/api
    description: Commvault REST API — Schedule Policies business capability. Self-contained, no shared references.
    resources:
    - name: SchedulePolicy
      path: /SchedulePolicy
      operations:
      - name: listschedulepolicies
        method: GET
        description: Commvault List schedule policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authtoken
      value: '{{env.COMMVAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-schedule-policies-rest
    port: 8080
    description: REST adapter for Commvault REST API — Schedule Policies. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/schedulepolicy
      name: schedulepolicy
      description: REST surface for SchedulePolicy.
      operations:
      - method: GET
        name: listschedulepolicies
        description: Commvault List schedule policies
        call: rest-schedule-policies.listschedulepolicies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-schedule-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commvault REST API — Schedule Policies. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: commvault-list-schedule-policies
      description: Commvault List schedule policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-schedule-policies.listschedulepolicies
      outputParameters:
      - type: object
        mapping: $.

naftiko: 1.0.0-alpha2
info:
  label: Commvault Automation API — Operations
  description: 'Commvault Automation API — Operations. 1 operations. Lead operation: Commvault Execute a qcommand operation.
    Self-contained Naftiko capability covering one Commvault business surface.'
  tags:
  - Commvault
  - Operations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMMVAULT_API_KEY: COMMVAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: automation-operations
    baseUri: https://{webserver}/webconsole/api
    description: Commvault Automation API — Operations business capability. Self-contained, no shared references.
    resources:
    - name: QCommand-qoperation
      path: /QCommand/qoperation
      operations:
      - name: executeqcommand
        method: POST
        description: Commvault Execute a qcommand operation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authtoken
      value: '{{env.COMMVAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: automation-operations-rest
    port: 8080
    description: REST adapter for Commvault Automation API — Operations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/qcommand/qoperation
      name: qcommand-qoperation
      description: REST surface for QCommand-qoperation.
      operations:
      - method: POST
        name: executeqcommand
        description: Commvault Execute a qcommand operation
        call: automation-operations.executeqcommand
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: automation-operations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commvault Automation API — Operations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: commvault-execute-qcommand-operation
      description: Commvault Execute a qcommand operation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: automation-operations.executeqcommand
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

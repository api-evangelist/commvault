naftiko: 1.0.0-alpha2
info:
  label: Commvault Command Center API — Databases
  description: 'Commvault Command Center API — Databases. 1 operations. Lead operation: Commvault List database servers. Self-contained
    Naftiko capability covering one Commvault business surface.'
  tags:
  - Commvault
  - Databases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMMVAULT_API_KEY: COMMVAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: command-center-databases
    baseUri: https://{commandcenter}/commandcenter/api
    description: Commvault Command Center API — Databases business capability. Self-contained, no shared references.
    resources:
    - name: V4-DatabaseServers
      path: /V4/DatabaseServers
      operations:
      - name: listdatabaseservers
        method: GET
        description: Commvault List database servers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authtoken
      value: '{{env.COMMVAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: command-center-databases-rest
    port: 8080
    description: REST adapter for Commvault Command Center API — Databases. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v4/databaseservers
      name: v4-databaseservers
      description: REST surface for V4-DatabaseServers.
      operations:
      - method: GET
        name: listdatabaseservers
        description: Commvault List database servers
        call: command-center-databases.listdatabaseservers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: command-center-databases-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commvault Command Center API — Databases. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: commvault-list-database-servers
      description: Commvault List database servers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: command-center-databases.listdatabaseservers
      outputParameters:
      - type: object
        mapping: $.

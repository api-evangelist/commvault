naftiko: 1.0.0-alpha2
info:
  label: Commvault REST API — Users
  description: 'Commvault REST API — Users. 2 operations. Lead operation: Commvault List users. Self-contained Naftiko capability
    covering one Commvault business surface.'
  tags:
  - Commvault
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMMVAULT_API_KEY: COMMVAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-users
    baseUri: https://{webserver}/webconsole/api
    description: Commvault REST API — Users business capability. Self-contained, no shared references.
    resources:
    - name: User
      path: /User
      operations:
      - name: listusers
        method: GET
        description: Commvault List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: User-userId
      path: /User/{userId}
      operations:
      - name: getuser
        method: GET
        description: Commvault Get user details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authtoken
      value: '{{env.COMMVAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-users-rest
    port: 8080
    description: REST adapter for Commvault REST API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/user
      name: user
      description: REST surface for User.
      operations:
      - method: GET
        name: listusers
        description: Commvault List users
        call: rest-users.listusers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/user/{userid}
      name: user-userid
      description: REST surface for User-userId.
      operations:
      - method: GET
        name: getuser
        description: Commvault Get user details
        call: rest-users.getuser
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commvault REST API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: commvault-list-users
      description: Commvault List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-users.listusers
      outputParameters:
      - type: object
        mapping: $.
    - name: commvault-get-user-details
      description: Commvault Get user details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-users.getuser
      outputParameters:
      - type: object
        mapping: $.

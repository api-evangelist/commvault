naftiko: 1.0.0-alpha2
info:
  label: Commvault Command Center API — Virtual Machines
  description: 'Commvault Command Center API — Virtual Machines. 2 operations. Lead operation: Commvault List virtual machines.
    Self-contained Naftiko capability covering one Commvault business surface.'
  tags:
  - Commvault
  - Virtual Machines
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMMVAULT_API_KEY: COMMVAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: command-center-virtual-machines
    baseUri: https://{commandcenter}/commandcenter/api
    description: Commvault Command Center API — Virtual Machines business capability. Self-contained, no shared references.
    resources:
    - name: VM
      path: /VM
      operations:
      - name: listvirtualmachines
        method: GET
        description: Commvault List virtual machines
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by protection status
        - name: hypervisorId
          in: query
          type: integer
          description: Filter by hypervisor client ID
    - name: VM-vmUUID
      path: /VM/{vmUUID}
      operations:
      - name: getvirtualmachine
        method: GET
        description: Commvault Get virtual machine details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authtoken
      value: '{{env.COMMVAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: command-center-virtual-machines-rest
    port: 8080
    description: REST adapter for Commvault Command Center API — Virtual Machines. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/vm
      name: vm
      description: REST surface for VM.
      operations:
      - method: GET
        name: listvirtualmachines
        description: Commvault List virtual machines
        call: command-center-virtual-machines.listvirtualmachines
        with:
          status: rest.status
          hypervisorId: rest.hypervisorId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/vm/{vmuuid}
      name: vm-vmuuid
      description: REST surface for VM-vmUUID.
      operations:
      - method: GET
        name: getvirtualmachine
        description: Commvault Get virtual machine details
        call: command-center-virtual-machines.getvirtualmachine
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: command-center-virtual-machines-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commvault Command Center API — Virtual Machines. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: commvault-list-virtual-machines
      description: Commvault List virtual machines
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: command-center-virtual-machines.listvirtualmachines
      with:
        status: tools.status
        hypervisorId: tools.hypervisorId
      outputParameters:
      - type: object
        mapping: $.
    - name: commvault-get-virtual-machine-details
      description: Commvault Get virtual machine details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: command-center-virtual-machines.getvirtualmachine
      outputParameters:
      - type: object
        mapping: $.

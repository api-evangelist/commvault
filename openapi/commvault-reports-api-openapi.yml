openapi: 3.2.0
info:
  title: Commvault Command Center Reports API
  description: APIs for managing Commvault Command Center operations, providing centralized management and monitoring capabilities for data protection infrastructure. The Command Center API enables dashboard access, server group management, virtual machine operations, and compliance monitoring across the Commvault environment.
  version: v4
  contact:
    name: Commvault Support
    url: https://www.commvault.com/support
  termsOfService: https://www.commvault.com/terms-of-use
servers:
- url: https://{commandcenter}/commandcenter/api
  description: Commvault Command Center
  variables:
    commandcenter:
      default: commandcenter.example.com
      description: Hostname of the Commvault Command Center
security:
- authToken: []
tags:
- name: Reports
  description: Reporting and analytics
paths:
  /Reports:
    get:
      operationId: listReports
      summary: Commvault List available reports
      description: Retrieves a list of all available reports, including built-in and custom reports for backup, storage, compliance, and operational analytics.
      tags:
      - Reports
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
        '401':
          description: Unauthorized
  /Reports/{reportId}:
    get:
      operationId: getReport
      summary: Commvault Get report data
      description: Executes a specific report and returns the report data, including charts, tables, and summary statistics.
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/reportId'
      - name: timeRange
        in: query
        required: false
        description: Time range for the report
        schema:
          type: string
      responses:
        '200':
          description: Report data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          description: Unauthorized
        '404':
          description: Report not found
components:
  parameters:
    reportId:
      name: reportId
      in: path
      required: true
      description: Unique identifier for the report
      schema:
        type: integer
  schemas:
    Report:
      type: object
      properties:
        reportId:
          type: integer
          description: Unique report identifier
        reportName:
          type: string
          description: Name of the report
        reportCategory:
          type: string
          description: Category of the report
          enum:
          - Backup
          - Storage
          - SLA
          - Compliance
          - Operational
          - Custom
        description:
          type: string
          description: Description of the report
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: Authtoken
      description: QSDK authentication token obtained from the Login endpoint.
externalDocs:
  description: Commvault Command Center API Documentation
  url: https://documentation.commvault.com/2024/essential/rest_api_command_center.html

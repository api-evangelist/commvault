openapi: 3.2.0
info:
  title: Commvault REST Schedule Policies API
  description: The Commvault REST API provides programmatic access to Commvault data protection and management operations, including clients, agents, subclients, backup jobs, restore jobs, storage policies, schedules, and reporting. This API uses XML or JSON request and response bodies and supports token-based authentication via login credentials or SAML-based SSO.
  version: v2
  contact:
    name: Commvault Support
    url: https://www.commvault.com/support
  termsOfService: https://www.commvault.com/terms-of-use
servers:
- url: https://{webserver}/webconsole/api
  description: Commvault Web Server
  variables:
    webserver:
      default: webconsole.example.com
      description: Hostname of the Commvault Web Server
security:
- authToken: []
tags:
- name: Schedule Policies
  description: Manage schedule policies for automated operations
paths:
  /SchedulePolicy:
    get:
      operationId: listSchedulePolicies
      summary: Commvault List schedule policies
      description: Retrieves a list of all schedule policies defined in the CommServe. Schedule policies automate backup, auxiliary copy, and other operations on a recurring basis.
      tags:
      - Schedule Policies
      responses:
        '200':
          description: List of schedule policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskDetail:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchedulePolicy'
        '401':
          description: Unauthorized
components:
  schemas:
    SchedulePolicy:
      type: object
      properties:
        taskId:
          type: integer
          description: Unique schedule policy identifier
        taskName:
          type: string
          description: Name of the schedule policy
        taskType:
          type: string
          description: Type of task
        subTasks:
          type: array
          items:
            type: object
            properties:
              subTaskName:
                type: string
                description: Name of the sub-task
              operationType:
                type: string
                description: Operation type (Backup, Restore, etc.)
              pattern:
                type: object
                properties:
                  freq_type:
                    type: string
                    description: Frequency type (Daily, Weekly, Monthly)
                  active_start_time:
                    type: integer
                    description: Schedule start time
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: Authtoken
      description: QSDK authentication token obtained from the Login endpoint. Include this token in all subsequent API requests.
externalDocs:
  description: Commvault REST API Documentation
  url: https://documentation.commvault.com/v11/essential/rest_api_overview.html

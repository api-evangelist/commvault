openapi: 3.2.0
info:
  title: Commvault Command Center File Servers API
  description: APIs for managing Commvault Command Center operations, providing centralized management and monitoring capabilities for data protection infrastructure. The Command Center API enables dashboard access, server group management, virtual machine operations, and compliance monitoring across the Commvault environment.
  version: v4
  contact:
    name: Commvault Support
    url: https://www.commvault.com/support
  termsOfService: https://www.commvault.com/terms-of-use
servers:
- url: https://{commandcenter}/commandcenter/api
  description: Commvault Command Center
  variables:
    commandcenter:
      default: commandcenter.example.com
      description: Hostname of the Commvault Command Center
security:
- authToken: []
tags:
- name: File Servers
  description: Manage file server protection
paths:
  /V4/FileServers:
    get:
      operationId: listFileServers
      summary: Commvault List file servers
      description: Retrieves a list of all file servers configured for protection, including NAS devices, Windows file servers, and Linux file servers.
      tags:
      - File Servers
      responses:
        '200':
          description: List of file servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileServers:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileServer'
        '401':
          description: Unauthorized
components:
  schemas:
    FileServer:
      type: object
      properties:
        clientId:
          type: integer
          description: Unique client identifier
        clientName:
          type: string
          description: File server name
        serverType:
          type: string
          description: Type of file server
          enum:
          - WindowsFileServer
          - LinuxFileServer
          - NAS
          - NetApp
          - Isilon
        protectionStatus:
          type: string
          description: Protection status
        planName:
          type: string
          description: Associated protection plan name
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: Authtoken
      description: QSDK authentication token obtained from the Login endpoint.
externalDocs:
  description: Commvault Command Center API Documentation
  url: https://documentation.commvault.com/2024/essential/rest_api_command_center.html

openapi: 3.2.0
info:
  title: Commvault Command Center Databases API
  description: APIs for managing Commvault Command Center operations, providing centralized management and monitoring capabilities for data protection infrastructure. The Command Center API enables dashboard access, server group management, virtual machine operations, and compliance monitoring across the Commvault environment.
  version: v4
  contact:
    name: Commvault Support
    url: https://www.commvault.com/support
  termsOfService: https://www.commvault.com/terms-of-use
servers:
- url: https://{commandcenter}/commandcenter/api
  description: Commvault Command Center
  variables:
    commandcenter:
      default: commandcenter.example.com
      description: Hostname of the Commvault Command Center
security:
- authToken: []
tags:
- name: Databases
  description: Manage database protection
paths:
  /V4/DatabaseServers:
    get:
      operationId: listDatabaseServers
      summary: Commvault List database servers
      description: Retrieves a list of all database servers configured for backup, including SQL Server, Oracle, SAP HANA, and other database platforms.
      tags:
      - Databases
      responses:
        '200':
          description: List of database servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseServers:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseServer'
        '401':
          description: Unauthorized
components:
  schemas:
    DatabaseServer:
      type: object
      properties:
        clientId:
          type: integer
          description: Unique client identifier
        clientName:
          type: string
          description: Database server name
        databaseType:
          type: string
          description: Database platform type
          enum:
          - SQLServer
          - Oracle
          - SAP_HANA
          - MySQL
          - PostgreSQL
          - DB2
          - Informix
        instanceName:
          type: string
          description: Database instance name
        protectionStatus:
          type: string
          description: Protection status
        lastBackupTime:
          type: integer
          description: Unix timestamp of last successful backup
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: Authtoken
      description: QSDK authentication token obtained from the Login endpoint.
externalDocs:
  description: Commvault Command Center API Documentation
  url: https://documentation.commvault.com/2024/essential/rest_api_command_center.html

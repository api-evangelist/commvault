openapi: 3.2.0
info:
  title: Commvault Command Center Laptops API
  description: APIs for managing Commvault Command Center operations, providing centralized management and monitoring capabilities for data protection infrastructure. The Command Center API enables dashboard access, server group management, virtual machine operations, and compliance monitoring across the Commvault environment.
  version: v4
  contact:
    name: Commvault Support
    url: https://www.commvault.com/support
  termsOfService: https://www.commvault.com/terms-of-use
servers:
- url: https://{commandcenter}/commandcenter/api
  description: Commvault Command Center
  variables:
    commandcenter:
      default: commandcenter.example.com
      description: Hostname of the Commvault Command Center
security:
- authToken: []
tags:
- name: Laptops
  description: Manage laptop backup operations
paths:
  /Laptop:
    get:
      operationId: listLaptops
      summary: Commvault List laptop clients
      description: Retrieves a list of all laptop clients enrolled for endpoint backup, including their protection status, last backup time, and data usage.
      tags:
      - Laptops
      responses:
        '200':
          description: List of laptop clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  laptopList:
                    type: array
                    items:
                      $ref: '#/components/schemas/LaptopClient'
        '401':
          description: Unauthorized
components:
  schemas:
    LaptopClient:
      type: object
      properties:
        clientId:
          type: integer
          description: Unique client identifier
        clientName:
          type: string
          description: Laptop hostname
        userName:
          type: string
          description: Laptop owner username
        osType:
          type: string
          description: Operating system type
          enum:
          - Windows
          - macOS
          - Linux
        backupStatus:
          type: string
          description: Current backup status
        lastBackupTime:
          type: integer
          description: Unix timestamp of last successful backup
        dataBackedUpGB:
          type: number
          format: float
          description: Total data backed up in GB
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: Authtoken
      description: QSDK authentication token obtained from the Login endpoint.
externalDocs:
  description: Commvault Command Center API Documentation
  url: https://documentation.commvault.com/2024/essential/rest_api_command_center.html

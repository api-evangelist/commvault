openapi: 3.2.0
info:
  title: Commvault Command Center Virtual Machines API
  description: APIs for managing Commvault Command Center operations, providing centralized management and monitoring capabilities for data protection infrastructure. The Command Center API enables dashboard access, server group management, virtual machine operations, and compliance monitoring across the Commvault environment.
  version: v4
  contact:
    name: Commvault Support
    url: https://www.commvault.com/support
  termsOfService: https://www.commvault.com/terms-of-use
servers:
- url: https://{commandcenter}/commandcenter/api
  description: Commvault Command Center
  variables:
    commandcenter:
      default: commandcenter.example.com
      description: Hostname of the Commvault Command Center
security:
- authToken: []
tags:
- name: Virtual Machines
  description: Manage virtual machine backup and recovery
paths:
  /VM:
    get:
      operationId: listVirtualMachines
      summary: Commvault List virtual machines
      description: Retrieves a list of all virtual machines registered for protection, including their backup status, hypervisor association, and SLA compliance.
      tags:
      - Virtual Machines
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by protection status
        schema:
          type: string
          enum:
          - Protected
          - NotProtected
          - NeverBackedUp
          - Pending
      - name: hypervisorId
        in: query
        required: false
        description: Filter by hypervisor client ID
        schema:
          type: integer
      responses:
        '200':
          description: List of virtual machines
          content:
            application/json:
              schema:
                type: object
                properties:
                  vmStatusInfoList:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualMachine'
        '401':
          description: Unauthorized
  /VM/{vmUUID}:
    get:
      operationId: getVirtualMachine
      summary: Commvault Get virtual machine details
      description: Retrieves detailed information about a specific virtual machine, including backup history, recovery points, and configuration.
      tags:
      - Virtual Machines
      parameters:
      - $ref: '#/components/parameters/vmUUID'
      responses:
        '200':
          description: Virtual machine details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachine'
        '401':
          description: Unauthorized
        '404':
          description: Virtual machine not found
components:
  schemas:
    VirtualMachine:
      type: object
      properties:
        vmUUID:
          type: string
          description: Unique UUID of the virtual machine
        vmName:
          type: string
          description: Name of the virtual machine
        vmStatus:
          type: string
          description: Protection status
          enum:
          - Protected
          - NotProtected
          - NeverBackedUp
          - Pending
        hypervisor:
          type: object
          properties:
            clientId:
              type: integer
            clientName:
              type: string
              description: Hypervisor name (vCenter, Hyper-V host, etc.)
        vmSize:
          type: integer
          description: Total VM size in bytes
        lastBackupTime:
          type: integer
          description: Unix timestamp of last successful backup
        lastBackupJobId:
          type: integer
          description: Job ID of the last backup
        planName:
          type: string
          description: Associated protection plan name
  parameters:
    vmUUID:
      name: vmUUID
      in: path
      required: true
      description: UUID of the virtual machine
      schema:
        type: string
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: Authtoken
      description: QSDK authentication token obtained from the Login endpoint.
externalDocs:
  description: Commvault Command Center API Documentation
  url: https://documentation.commvault.com/2024/essential/rest_api_command_center.html
